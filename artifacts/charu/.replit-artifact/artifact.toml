kind = "web"
previewPath = "/"
title = "Charu — The Assembly Planner"
description = "Charu — The Assembly Planner combines its Nebius-powered Brief Studio for constrained assembly proposals with Desk Kit mode for deterministic custom-fit 3D organizers, local scene editing, dimensional fit checks, and printer-aware prototype exports."
version = "1.0.0"
id = "artifacts/charu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22046

[services.development]
run = "pnpm --filter @workspace/charu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/charu", "run", "build" ]
serve = "static"
publicDir = "artifacts/charu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22046"
BASE_PATH = "/"
